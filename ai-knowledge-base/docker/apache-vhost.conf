<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Persistent storage must never be web-accessible.
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    # Production security headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"

    # Public voice chat needs microphone access on this origin.
    Header always set Permissions-Policy "microphone=(self), camera=(), geolocation=()"

    # Transitional CSP:
    # - Bootstrap and Bootstrap Icons are loaded from jsDelivr.
    # - Existing AIKB views contain inline CSS/JS, therefore unsafe-inline
    #   remains temporarily necessary until nonce/hash conversion.
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:"

    # The public application is HTTPS-only through the canonical Cloudflare
    # hostname. HSTS is honored by browsers only over HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"

    # Remove unnecessary PHP technology disclosure from Apache responses.
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
